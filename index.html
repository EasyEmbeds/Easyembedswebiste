<!-- Simple HTML mimicking Discord -->
<div class="discord-verify">
  <h2>Verify Your Account</h2>
  <button onclick="loginWithDiscord()">Login with Discord</button>
</div>

<script>
  function loginWithDiscord() {
    // Redirect to Discord OAuth2
    const clientId = "YOUR_CLIENT_ID";
    const redirectUri = "https://your-website.com/callback";
    window.location.href = `https://discord.com/oauth2/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=identify+email`;
  }
</script>
